<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>What Is Semantic SEO?</title>
<style>
  html, body { margin: 0; background: #050706; }
  canvas { display: block; width: 360px; height: 640px; }
  body.preview canvas { width: auto; height: 96vh; margin: 2vh auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic, frame-by-frame animation: draw(t) renders the frame at time t (seconds).
// render.js calls draw() for every frame; open with ?preview to watch it in a browser.
const W = 1080, H = 1920;
const DURATION = 54;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const NEON = '#c8ff2e', BLUE = '#3a63f5', RED = '#ff4d5e', AMBER = '#ffb547', CYAN = '#3ee0ff', PINK = '#ff6bd5';
const TEXT = '#eef3e6', MUTED = '#8a9585', BG = '#050706';
const SANS = 'Inter, "DejaVu Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';

const logo = new Image();
logo.src = 'assets/permanent-seo-logo.png';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const typed = (s, p) => s.slice(0, Math.floor(s.length * clamp(p)));
function sceneAlpha(t, a, b, f = 0.4) { return Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b)); }
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(s, x, y, { size = 40, weight = 700, color = TEXT, align = 'left', font = SANS, glow = 0, alpha = 1, base = 'alphabetic' } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 700, font = SANS) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function line(x1, y1, x2, y2, color, w = 3, glow = 0, dash = null) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function check(x, y, s, p, color = NEON) {
  const k = clamp(p, 0, 1.2);
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(k * s / 34, k * s / 34);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#081004'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-4, 12); ctx.lineTo(15, -11); ctx.stroke();
  ctx.restore();
}
function pill(s, x, y, { size = 30, color = NEON, fill = null, textColor = null, font = MONO, weight = 700, pad = 22, h = null, scale = 1, alpha = 1, glow = 0 } = {}) {
  const w = measure(s, size, weight, font) + pad * 2;
  const hh = h || size * 2;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  rr(-w / 2, -hh / 2, w, hh, hh / 2);
  ctx.fillStyle = fill || rgba(color, 0.12); ctx.fill();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  text(s, 0, size * 0.36, { size, weight, color: textColor || color, align: 'center', font });
  ctx.restore();
  return w;
}
function rand(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// ---------- background ----------
const bgRows = (() => {
  const r = rand(11);
  const ents = [['Running Shoe', 'Product'], ['Brooks', 'Brand'], ['Flat Feet', 'Condition'], ['Arch Support', 'Attribute'],
    ['Podiatrist', 'Person'], ['Pronation', 'Concept'], ['Marathon', 'Event'], ['Cushioning', 'Attribute'], ['Semantic SEO', 'Topic'],
    ['Knowledge Graph', 'Concept'], ['Search Intent', 'Concept'], ['Google', 'Organization']];
  const rels = ['relatedTo', 'hasAttribute', 'isA', 'helpsWith', 'madeBy', 'recommendedBy', 'partOf', 'about'];
  const rows = [];
  for (let i = 0; i < 40; i++) {
    const a = ents[Math.floor(r() * ents.length)], b = ents[Math.floor(r() * ents.length)];
    const rel = rels[Math.floor(r() * rels.length)];
    const id = 'kg:/m/0' + Math.floor(r() * 899999 + 100000).toString(36);
    rows.push(i % 2 === 0
      ? `{ "@type": "${a[1]}", "name": "${a[0]}", "${rel}": "${b[0]}" } · ${id}`
      : `entity("${a[0]}") —${rel}→ entity("${b[0]}") · salience ${(r() * 0.6 + 0.3).toFixed(2)}`);
  }
  return rows;
})();

function drawBackground(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  // scrolling entity / triple log
  ctx.save();
  ctx.font = `500 30px ${MONO}`;
  ctx.fillStyle = 'rgba(200,255,46,0.05)';
  const rowH = 58, off = (t * 22) % rowH;
  const start = Math.floor(t * 22 / rowH);
  for (let i = -1; i < H / rowH + 2; i++) {
    const s = bgRows[(start + i + 4000) % bgRows.length];
    ctx.fillText(s, -40 - ((start + i) % 3) * 120, i * rowH - off + 40);
  }
  ctx.restore();
  // dot grid
  ctx.fillStyle = 'rgba(200,255,46,0.07)';
  for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) ctx.fillRect(x, y, 2, 2);
  // vignette + brand glow
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.45, 1200);
  g.addColorStop(0, 'rgba(5,7,6,0)'); g.addColorStop(1, 'rgba(5,7,6,0.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const b = ctx.createRadialGradient(0, 0, 0, 0, 0, 700);
  b.addColorStop(0, 'rgba(58,99,245,0.22)'); b.addColorStop(1, 'rgba(58,99,245,0)');
  ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
  const b2 = ctx.createRadialGradient(W, H, 0, W, H, 800);
  b2.addColorStop(0, 'rgba(200,255,46,0.08)'); b2.addColorStop(1, 'rgba(200,255,46,0)');
  ctx.fillStyle = b2; ctx.fillRect(0, 0, W, H);
  // scan line
  const sy = (t * 420) % (H + 400) - 200;
  const sg = ctx.createLinearGradient(0, sy - 120, 0, sy);
  sg.addColorStop(0, 'rgba(200,255,46,0)'); sg.addColorStop(1, 'rgba(200,255,46,0.05)');
  ctx.fillStyle = sg; ctx.fillRect(0, sy - 120, W, 120);
}

// ---------- branding ----------
function drawBranding(t) {
  const a = prog(t, 0, 0.6);
  ctx.save();
  ctx.globalAlpha = a;
  // logo top-left
  const s = 104, x = 48, y = 48;
  ctx.save();
  ctx.shadowColor = 'rgba(58,99,245,0.8)'; ctx.shadowBlur = 30;
  rr(x, y, s, s, 22); ctx.fillStyle = BLUE; ctx.fill();
  ctx.restore();
  ctx.save(); rr(x, y, s, s, 22); ctx.clip();
  if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, x, y, s, s);
  ctx.restore();
  text('PERMANENT SEO', x + s + 24, y + 52, { size: 38, weight: 800, color: '#ffffff' });
  text('SEO AGENCY', x + s + 26, y + 90, { size: 22, weight: 600, color: NEON, font: MONO });
  // name bottom-right
  text('Created by', W - 48, H - 112, { size: 24, weight: 500, color: MUTED, align: 'right', font: MONO });
  text('M Mehrooz Shafique', W - 48, H - 66, { size: 40, weight: 800, color: '#ffffff', align: 'right' });
  const nw = measure('M Mehrooz Shafique', 40, 800);
  line(W - 48 - nw, H - 46, W - 48, H - 46, NEON, 4, 12);
  ctx.restore();
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.save(); ctx.shadowColor = NEON; ctx.shadowBlur = 14;
  ctx.fillStyle = NEON; ctx.fillRect(0, H - 8, W * clamp(t / DURATION), 8);
  ctx.restore();
}

function stepHeader(t, a, step, title) {
  const p = easeOut(prog(t, a, a + 0.6));
  ctx.save();
  ctx.globalAlpha *= p;
  ctx.translate(0, (1 - p) * 30);
  ctx.font = `700 26px ${MONO}`;
  const lw = ctx.measureText(step).width + 40;
  rr(W / 2 - lw / 2, 222, lw, 50, 25);
  ctx.strokeStyle = NEON; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(200,255,46,0.1)'; ctx.fill();
  text(step, W / 2, 256, { size: 26, weight: 700, color: NEON, align: 'center', font: MONO });
  // shrink long titles to fit the frame
  const size = Math.min(74, Math.floor(74 * (W - 120) / measure(title, 74, 900)));
  text(title, W / 2, 360, { size, weight: 900, color: '#ffffff', align: 'center' });
  ctx.restore();
}

function caption(t, a, lines, color = TEXT) {
  const p = easeOut(prog(t, a, a + 0.5));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= p;
  const y0 = 1560 + (1 - p) * 20;
  const h = 40 + lines.length * 52;
  rr(70, y0, W - 140, h, 22);
  ctx.fillStyle = 'rgba(10,14,8,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,255,46,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  lines.forEach((l, i) => {
    // allow inline highlight with *word*
    const parts = l.split('*');
    let total = 0; parts.forEach((s, j) => total += measure(s, 38, j % 2 ? 800 : 600));
    let x = W / 2 - total / 2;
    parts.forEach((s, j) => {
      text(s, x, y0 + 66 + i * 52, { size: 38, weight: j % 2 ? 800 : 600, color: j % 2 ? NEON : color });
      x += measure(s, 38, j % 2 ? 800 : 600);
    });
  });
  ctx.restore();
}

// glowing graph node
function node(x, y, r, color, p = 1, pulse = 0) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= clamp(p);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 24 + pulse * 20;
  ctx.beginPath(); ctx.arc(x, y, r * clamp(p, 0, 1.2) + pulse * 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- scene 1: title ----------
function scene1(t) {
  const a = sceneAlpha(t, -1, 4.7);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  // mini knowledge graph forming above the title
  const cx = W / 2, cy = 560;
  const cols = [NEON, CYAN, AMBER, PINK, BLUE, NEON];
  const cp = backOut(prog(t, 0.1, 0.6));
  for (let i = 0; i < 6; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 3 + t * 0.35;
    const rad = 200 + Math.sin(t * 2 + i) * 10;
    const st = 0.3 + i * 0.12;
    const lp = easeOut(prog(t, st, st + 0.4));
    const x = cx + Math.cos(ang) * rad * lp, y = cy + Math.sin(ang) * rad * 0.62 * lp;
    line(cx, cy, x, y, rgba(cols[i], 0.6), 3, 10);
    const ni = (i + 1) % 6, na = -Math.PI / 2 + ni * Math.PI / 3 + t * 0.35;
    const np = easeOut(prog(t, 0.3 + ni * 0.12, 0.7 + ni * 0.12)) * prog(t, 1.2, 1.6);
    if (np > 0) {
      const nr = 200 + Math.sin(t * 2 + ni) * 10;
      line(x, y, cx + Math.cos(na) * nr, cy + Math.sin(na) * nr * 0.62, rgba(NEON, 0.2 * np), 2, 0, [6, 8]);
    }
    node(x, y, 16, cols[i], backOut(prog(t, st + 0.2, st + 0.5)));
  }
  node(cx, cy, 38, NEON, cp, 0.5 + Math.sin(t * 5) * 0.5);
  text('SEO', cx, cy + 12, { size: 30, weight: 900, color: '#081004', align: 'center', alpha: clamp(cp) });

  const lines = [
    ['WHAT IS', 112, '#ffffff', 0.7, 860],
    ['SEMANTIC', 168, NEON, 1.0, 1030],
    ['SEO?', 150, '#ffffff', 1.3, 1170],
  ];
  lines.forEach(([s, size, color, st, y]) => {
    const p = easeOut(prog(t, st, st + 0.6));
    text(s, W / 2, y + (1 - p) * 60, { size, weight: 900, color, align: 'center', alpha: p, glow: color === NEON ? 30 : 0 });
  });
  const p4 = easeOut(prog(t, 1.9, 2.4));
  text('Beyond keywords — optimize for meaning', W / 2, 1270, { size: 40, weight: 500, color: MUTED, align: 'center', alpha: p4 });
  const chips = ['Meaning', 'Context', 'Entities', 'Intent'];
  const gap = 24;
  let total = gap * 3;
  chips.forEach(s => total += measure(s, 34, 700, MONO) + 44);
  let x = W / 2 - total / 2;
  chips.forEach((s, i) => {
    const p = backOut(prog(t, 2.4 + i * 0.3, 2.8 + i * 0.3));
    const w = measure(s, 34, 700, MONO) + 44;
    if (p > 0) pill(s, x + w / 2, 1390, { size: 34, scale: clamp(p, 0, 1.2), alpha: clamp(p), pad: 22, h: 72 });
    x += w + gap;
  });
  ctx.restore();
}

// ---------- scene 2: definition ----------
const S2 = 4.5, S2E = 12.4;
const pillars = [
  ['Meaning', 'what it really is', NEON],
  ['Context', 'who, where & why', CYAN],
  ['Entities', 'people, products, brands', AMBER],
  ['Attributes', 'size, cushioning, price', PINK],
  ['Relationships', 'how things connect', '#8fa8ff'],
];
function scene2(t) {
  const A = S2;
  const a = sceneAlpha(t, A, S2E);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  stepHeader(t, A, 'DEFINITION', 'Keywords → Meaning');
  // part A: keyword-only page
  const kp = easeOut(prog(t, A + 0.4, A + 0.9)) * (1 - easeInOut(prog(t, A + 3.0, A + 3.5)));
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha *= kp; ctx.translate(0, (1 - kp) * 30);
    rr(110, 460, 860, 520, 24);
    ctx.fillStyle = 'rgba(14,16,12,0.95)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
    text('OLD WAY: KEYWORD-ONLY SEO', 150, 520, { size: 26, weight: 700, color: MUTED, font: MONO });
    line(140, 545, 940, 545, 'rgba(255,255,255,0.12)', 2);
    const kw = ['Running shoes. Best running', 'shoes. Cheap running shoes.', 'Running shoes running shoes', 'buy running shoes online.', 'Running shoes 2026…'];
    kw.forEach((s, i) => {
      const st = A + 0.7 + i * 0.25;
      text(typed(s, prog(t, st, st + 0.3)), 150, 610 + i * 62, { size: 38, weight: 600, color: '#9aa392' });
    });
    const sp = backOut(prog(t, A + 2.1, A + 2.5));
    if (sp > 0) {
      ctx.save(); ctx.globalAlpha *= clamp(sp); ctx.translate(700, 900); ctx.rotate(-0.08); ctx.scale(lerp(1.8, 1, clamp(sp)), lerp(1.8, 1, clamp(sp)));
      rr(-230, -42, 460, 84, 16); ctx.strokeStyle = RED; ctx.lineWidth = 5; ctx.shadowColor = RED; ctx.shadowBlur = 20; ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(40,6,10,0.85)'; ctx.fill();
      text('✗ KEYWORD STUFFING', 0, 13, { size: 36, weight: 900, color: RED, align: 'center' });
      ctx.restore();
    }
    ctx.restore();
  }
  // part B: the query and its five semantic layers
  const B0 = A + 3.4;
  const qp = backOut(prog(t, B0, B0 + 0.5));
  if (qp > 0) {
    const cx = 540, cy = 1000, R = 380;
    pillars.forEach(([name, desc, col], i) => {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / 5;
      const x = cx + Math.cos(ang) * R, y = cy + Math.sin(ang) * R;
      const st = B0 + 0.5 + i * 0.35;
      const lp = easeOut(prog(t, st, st + 0.35));
      if (lp <= 0) return;
      line(cx, cy, lerp(cx, x, lp), lerp(cy, y, lp), rgba(col, 0.8), 4, 14);
      // travelling pulse
      const pp = ((t - st) * 0.8) % 1;
      if (lp >= 1) node(lerp(cx, x, pp), lerp(cy, y, pp), 6, col, 1);
      const bp = backOut(prog(t, st + 0.25, st + 0.6));
      if (bp > 0) {
        pill(name, x, y, { size: 32, color: col, fill: 'rgba(8,12,6,0.95)', textColor: '#ffffff', font: SANS, weight: 800, h: 74, scale: clamp(bp, 0, 1.2), glow: 18 });
        text(desc, x, y + 72, { size: 25, weight: 600, color: col, align: 'center', font: MONO, alpha: prog(t, st + 0.5, st + 0.8) });
      }
    });
    ctx.save(); ctx.globalAlpha *= clamp(qp);
    ctx.translate(cx, cy); ctx.scale(clamp(qp, 0, 1.2), clamp(qp, 0, 1.2));
    ctx.shadowColor = NEON; ctx.shadowBlur = 40 + Math.sin(t * 5) * 10;
    rr(-190, -60, 380, 120, 60); ctx.fillStyle = NEON; ctx.fill();
    ctx.shadowBlur = 0;
    text('SEARCH QUERY', 0, -14, { size: 20, weight: 700, color: '#25400a', align: 'center', font: MONO });
    text('“running shoes”', 0, 28, { size: 38, weight: 900, color: '#081004', align: 'center' });
    ctx.restore();
  }
  caption(t, A + 3.6, ['Optimize for the *meaning* behind a query —', 'not just the *keywords* in it.']);
  ctx.restore();
}

// ---------- scene 3: why #1 search intent ----------
const S3 = 12.2, S3E = 18.8;
function scene3(t) {
  const A = S3;
  const a = sceneAlpha(t, A, S3E);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  stepHeader(t, A, 'WHY? 1 / 5', 'Understand Search Intent');
  // search bar
  const bp = easeOut(prog(t, A + 0.3, A + 0.7));
  ctx.save(); ctx.globalAlpha *= bp; ctx.translate(0, (1 - bp) * 30);
  rr(90, 440, 900, 110, 55);
  ctx.fillStyle = '#f4f7ef'; ctx.fill();
  ctx.strokeStyle = NEON; ctx.lineWidth = 3; ctx.shadowColor = NEON; ctx.shadowBlur = 20; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#6b7266'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(160, 490, 18, 0, Math.PI * 2); ctx.stroke();
  line(173, 503, 188, 518, '#6b7266', 6);
  const q = 'running shoes for flat feet';
  const qs = typed(q, prog(t, A + 0.6, A + 1.8));
  text(qs, 215, 508, { size: 40, weight: 600, color: '#111' });
  if (Math.floor(t * 3) % 2 === 0 && t < A + 2.4) {
    const cx = 215 + measure(qs, 40, 600) + 4;
    ctx.fillStyle = '#111'; ctx.fillRect(cx, 474, 3, 46);
  }
  ctx.restore();
  // what the user really wants
  const hp = easeOut(prog(t, A + 1.9, A + 2.3));
  text('What does the user actually want?', W / 2, 640, { size: 40, weight: 700, color: MUTED, align: 'center', alpha: hp });
  const rows = [['WHO', 'A runner with flat feet', CYAN], ['NEED', 'Arch support & stability', AMBER], ['GOAL', 'Compare, then buy the right pair', NEON]];
  rows.forEach(([k, v, col], i) => {
    const st = A + 2.2 + i * 0.4;
    const p = easeOut(prog(t, st, st + 0.4));
    if (p <= 0) return;
    const y = 700 + i * 140;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate((1 - p) * -60, 0);
    rr(90, y, 900, 110, 20);
    ctx.fillStyle = 'rgba(14,20,10,0.9)'; ctx.fill();
    ctx.strokeStyle = rgba(col, 0.5); ctx.lineWidth = 2; ctx.stroke();
    rr(115, y + 28, 130, 54, 12); ctx.fillStyle = rgba(col, 0.16); ctx.fill();
    ctx.strokeStyle = col; ctx.stroke();
    text(k, 180, y + 65, { size: 26, weight: 800, color: col, align: 'center', font: MONO });
    text(v, 275, y + 69, { size: 38, weight: 700, color: '#ffffff' });
    ctx.restore();
  });
  // intent types
  const types = ['Informational', 'Navigational', 'Commercial', 'Transactional'];
  const tp = prog(t, A + 3.6, A + 4.0);
  if (tp > 0) {
    text('SEARCH INTENT TYPES', W / 2, 1160, { size: 26, weight: 700, color: MUTED, align: 'center', font: MONO, alpha: tp });
    const sel = t > A + 4.5;
    types.forEach((s, i) => {
      const p = backOut(prog(t, A + 3.7 + i * 0.12, A + 4.0 + i * 0.12));
      const x = i % 2 === 0 ? 300 : 780, y = 1240 + Math.floor(i / 2) * 100;
      const on = sel && s === 'Commercial';
      const dim = sel && !on;
      pill(s, x, y, {
        size: 32, color: on ? NEON : dim ? '#4d5449' : '#8fa8ff', font: SANS, weight: 800, h: 76,
        fill: on ? NEON : 'rgba(8,12,6,0.9)', textColor: on ? '#081004' : dim ? '#6b7266' : '#ffffff',
        scale: clamp(p, 0, 1.2) * (on ? 1 + 0.08 * Math.sin(prog(t, A + 4.5, A + 4.9) * Math.PI) : 1), alpha: clamp(p), glow: on ? 30 : 0,
      });
    });
    const mp = easeOut(prog(t, A + 4.8, A + 5.2));

  ctx.restore();
}
