<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GoHighLevel Expert Guide</title>
<style>
  html, body { margin: 0; background: #050706; }
  canvas { display: block; width: 360px; height: 640px; }
  body.preview canvas { width: auto; height: 96vh; margin: 2vh auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic, frame-by-frame animation: draw(t) renders the frame at time t (seconds).
// render.js calls draw() for every frame; open with ?preview to watch it in a browser.
const W = 1080, H = 1920;
const DURATION = 68;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const NEON = '#c8ff2e', BLUE = '#3a63f5', RED = '#ff4d5e', AMBER = '#ffb547', CYAN = '#3ee0ff', PINK = '#ff6bd5', LILAC = '#8fa8ff';
const TEXT = '#eef3e6', MUTED = '#8a9585', BG = '#050706';
const SANS = 'Inter, "Noto Color Emoji", "DejaVu Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", "Noto Color Emoji", monospace';

const logo = new Image();
logo.src = 'assets/permanent-seo-logo.png';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function sceneAlpha(t, a, b, f = 0.4) { return Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b)); }
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(s, x, y, { size = 40, weight = 700, color = TEXT, align = 'left', font = SANS, glow = 0, alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 700, font = SANS) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
// largest font size <= max that keeps s within width
const fit = (s, max, width, weight = 900, font = SANS) => Math.min(max, Math.floor(max * width / measure(s, max, weight, font)));
function line(x1, y1, x2, y2, color, w = 3, glow = 0, dash = null) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function check(x, y, s, p, color = NEON) {
  const k = clamp(p, 0, 1.2);
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(k * s / 34, k * s / 34);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = '#081004'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-4, 12); ctx.lineTo(15, -11); ctx.stroke();
  ctx.restore();
}
function pill(s, x, y, { size = 30, color = NEON, fill = null, textColor = null, font = MONO, weight = 700, pad = 22, h = null, scale = 1, alpha = 1, glow = 0 } = {}) {
  const w = measure(s, size, weight, font) + pad * 2;
  const hh = h || size * 2;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  rr(-w / 2, -hh / 2, w, hh, hh / 2);
  ctx.fillStyle = fill || rgba(color, 0.12); ctx.fill();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  text(s, 0, size * 0.36, { size, weight, color: textColor || color, align: 'center', font });
  ctx.restore();
  return w;
}
function card(x, y, w, h, color, { r = 22, fill = 'rgba(12,16,10,0.92)', glow = 0, lw = 2 } = {}) {
  rr(x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  ctx.save();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
  ctx.restore();
}
function node(x, y, r, color, p = 1) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(p);
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// slide-in transform wrapper: runs fn with alpha + offset driven by p
function enter(p, dx, dy, fn) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(p); ctx.translate((1 - p) * dx, (1 - p) * dy); fn(); ctx.restore();
}
function rand(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

// ---------- background ----------
const bgRows = (() => {
  const r = rand(23);
  const trig = ['Form Submitted', 'Tag Added', 'Appointment Booked', 'Stage Changed', 'Invoice Paid', 'Missed Call', 'Review Received'];
  const act = ['Send SMS', 'Send Email', 'Wait 10 min', 'If/Else', 'Webhook', 'Assign User', 'Create Task', 'AI Reply', 'Add to Pipeline'];
  const rows = [];
  for (let i = 0; i < 40; i++) {
    const a = trig[Math.floor(r() * trig.length)], b = act[Math.floor(r() * act.length)], c = act[Math.floor(r() * act.length)];
    rows.push(i % 2 === 0
      ? `WORKFLOW ▸ trigger: ${a} → ${b} → ${c} · sub-account #${Math.floor(r() * 90 + 10)}`
      : `opportunity.stage = "Booked" · contact.tags += "hot-lead" · $${Math.floor(r() * 1900 + 100)} · ${Math.floor(r() * 59 + 1)}s reply`);
  }
  return rows;
})();

function drawBackground(t) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.font = `500 30px ${MONO}`;
  ctx.fillStyle = 'rgba(200,255,46,0.05)';
  const rowH = 58, off = (t * 22) % rowH;
  const start = Math.floor(t * 22 / rowH);
  for (let i = -1; i < H / rowH + 2; i++) {
    const s = bgRows[(start + i + 4000) % bgRows.length];
    ctx.fillText(s, -40 - ((start + i) % 3) * 120, i * rowH - off + 40);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(200,255,46,0.07)';
  for (let y = 20; y < H; y += 40) for (let x = 20; x < W; x += 40) ctx.fillRect(x, y, 2, 2);
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H * 0.45, 1200);
  g.addColorStop(0, 'rgba(5,7,6,0)'); g.addColorStop(1, 'rgba(5,7,6,0.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const b = ctx.createRadialGradient(0, 0, 0, 0, 0, 700);
  b.addColorStop(0, 'rgba(58,99,245,0.22)'); b.addColorStop(1, 'rgba(58,99,245,0)');
  ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
  const b2 = ctx.createRadialGradient(W, H, 0, W, H, 800);
  b2.addColorStop(0, 'rgba(200,255,46,0.08)'); b2.addColorStop(1, 'rgba(200,255,46,0)');
  ctx.fillStyle = b2; ctx.fillRect(0, 0, W, H);
  const sy = (t * 420) % (H + 400) - 200;
  const sg = ctx.createLinearGradient(0, sy - 120, 0, sy);
  sg.addColorStop(0, 'rgba(200,255,46,0)'); sg.addColorStop(1, 'rgba(200,255,46,0.05)');
  ctx.fillStyle = sg; ctx.fillRect(0, sy - 120, W, 120);
}

// ---------- branding ----------
function logoTile(x, y, s, glow = 30) {
  ctx.save();
  ctx.shadowColor = 'rgba(58,99,245,0.8)'; ctx.shadowBlur = glow;
  rr(x, y, s, s, s * 0.21); ctx.fillStyle = BLUE; ctx.fill();
  ctx.restore();
  ctx.save(); rr(x, y, s, s, s * 0.21); ctx.clip();
  if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, x, y, s, s);
  ctx.restore();
}
function drawBranding(t) {
  const a = prog(t, 0, 0.6);
  ctx.save();
  ctx.globalAlpha = a;
  const s = 104, x = 48, y = 48;
  logoTile(x, y, s);
  text('PERMANENT SEO', x + s + 24, y + 52, { size: 38, weight: 800, color: '#ffffff' });
  text('SEO AGENCY', x + s + 26, y + 90, { size: 22, weight: 600, color: NEON, font: MONO });
  // creator credit bottom-right
  text('M Mehrooz Shafique', W - 48, H - 96, { size: 40, weight: 800, color: '#ffffff', align: 'right' });
  text('Co-Founder of Permanent SEO', W - 48, H - 56, { size: 24, weight: 600, color: NEON, align: 'right', font: MONO });
  const nw = measure('M Mehrooz Shafique', 40, 800);
  line(W - 48 - nw, H - 84, W - 48, H - 84, NEON, 3, 10);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.save(); ctx.shadowColor = NEON; ctx.shadowBlur = 14;
  ctx.fillStyle = NEON; ctx.fillRect(0, H - 8, W * clamp(t / DURATION), 8);
  ctx.restore();
}

function stepHeader(t, a, step, title) {
  const p = easeOut(prog(t, a, a + 0.6));
  ctx.save();
  ctx.globalAlpha *= p;
  ctx.translate(0, (1 - p) * 30);
  ctx.font = `700 26px ${MONO}`;
  const lw = ctx.measureText(step).width + 40;
  rr(W / 2 - lw / 2, 222, lw, 50, 25);
  ctx.strokeStyle = NEON; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(200,255,46,0.1)'; ctx.fill();
  text(step, W / 2, 256, { size: 26, weight: 700, color: NEON, align: 'center', font: MONO });
  text(title, W / 2, 360, { size: fit(title, 74, W - 120), weight: 900, color: '#ffffff', align: 'center' });
  ctx.restore();
}

function caption(t, a, lines, color = TEXT) {
  const p = easeOut(prog(t, a, a + 0.5));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha *= p;
  const y0 = 1560 + (1 - p) * 20;
  const h = 40 + lines.length * 52;
  rr(70, y0, W - 140, h, 22);
  ctx.fillStyle = 'rgba(10,14,8,0.85)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,255,46,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  lines.forEach((l, i) => {
    // allow inline highlight with *word*
    const parts = l.split('*');
    let total = 0; parts.forEach((s, j) => total += measure(s, 38, j % 2 ? 800 : 600));
    let x = W / 2 - total / 2;
    parts.forEach((s, j) => {
      text(s, x, y0 + 66 + i * 52, { size: 38, weight: j % 2 ? 800 : 600, color: j % 2 ? NEON : color });
      x += measure(s, 38, j % 2 ? 800 : 600);
    });
  });
  ctx.restore();
}

// ---------- scene 1: title ----------
function scene1(t) {
  const a = sceneAlpha(t, -1, 4.7);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  // hub with orbiting feature icons
  const cx = W / 2, cy = 560;
  const icons = ['👥', '💬', '📅', '⚙️', '🤖', '⭐', '🧲', '💳'];
  icons.forEach((ic, i) => {
    const st = 0.3 + i * 0.08;
    const p = easeOut(prog(t, st, st + 0.5));
    if (p <= 0) return;
    const ang = -Math.PI / 2 + i * Math.PI / 4 + t * 0.4;
    const x = cx + Math.cos(ang) * 230 * p, y = cy + Math.sin(ang) * 150 * p;
    line(cx, cy, x, y, rgba(NEON, 0.35 * p), 2, 0, [6, 8]);
    ctx.save(); ctx.globalAlpha *= p;
    rr(x - 38, y - 38, 76, 76, 20); ctx.fillStyle = 'rgba(10,14,8,0.95)'; ctx.fill();
    ctx.strokeStyle = rgba(NEON, 0.6); ctx.lineWidth = 2; ctx.stroke();
    text(ic, x, y + 14, { size: 38, align: 'center' });
    ctx.restore();
  });
  const hp = backOut(prog(t, 0.1, 0.6));
  if (hp > 0) {
    ctx.save(); ctx.globalAlpha *= clamp(hp); ctx.translate(cx, cy); ctx.scale(clamp(hp, 0, 1.2), clamp(hp, 0, 1.2));
    ctx.shadowColor = NEON; ctx.shadowBlur = 40 + Math.sin(t * 5) * 12;
    ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fillStyle = NEON; ctx.fill();
    ctx.shadowBlur = 0;
    text('GHL', 0, 16, { size: 46, weight: 900, color: '#081004', align: 'center' });
    ctx.restore();
  }
  const lines = [
    ['BECOME A', 96, '#ffffff', 0.7, 880],
    ['GOHIGHLEVEL', 0, NEON, 1.0, 1030],
    ['EXPERT', 150, '#ffffff', 1.3, 1180],
  ];
  lines.forEach(([s, size, color, st, y]) => {
    const p = easeOut(prog(t, st, st + 0.6));
    const sz = size || fit(s, 160, W - 100);
    text(s, W / 2, y + (1 - p) * 60, { size: sz, weight: 900, color, align: 'center', alpha: p, glow: color === NEON ? 30 : 0 });
  });
  const p4 = easeOut(prog(t, 1.8, 2.3));
  ctx.save(); ctx.globalAlpha *= p4;
  const s1 = '& land clients on ', s2 = 'autopilot';
  const tw = measure(s1, 46, 600) + measure(s2, 46, 900);
  text(s1, W / 2 - tw / 2, 1280, { size: 46, weight: 600, color: TEXT });
  text(s2, W / 2 - tw / 2 + measure(s1, 46, 600), 1280, { size: 46, weight: 900, color: NEON, glow: 16 });
  ctx.restore();
  const chips = ['Features', 'Earning', 'Clients', '90-Day Plan'];
  const gap = 20;
  let total = gap * 3;
  chips.forEach(s => total += measure(s, 30, 700, MONO) + 40);
  let x = W / 2 - total / 2;
  chips.forEach((s, i) => {
    const p = backOut(prog(t, 2.4 + i * 0.25, 2.8 + i * 0.25));
    const w = measure(s, 30, 700, MONO) + 40;
    if (p > 0) pill(s, x + w / 2, 1400, { size: 30, scale: clamp(p, 0, 1.2), alpha: clamp(p), pad: 20, h: 66 });
    x += w + gap;
  });
  ctx.restore();
}

// ---------- scene 2: stats ----------
const S2 = 4.4, S2E = 10.6;
const stats = [
  [60000, v => Math.round(v).toLocaleString('en-US') + '+', 'agencies using', 'HighLevel', NEON],
  [1.4, v => v.toFixed(1) + 'M', 'businesses on', 'the platform', CYAN],
  [529257, v => Math.round(v).toLocaleString('en-US'), 'live websites built', 'on HighLevel', AMBER],
  [40, v => Math.round(v) + '%', 'recurring affiliate', 'commission', PINK],
];
function scene2(t) {
  const A = S2;
  const a = sceneAlpha(t, A, S2E);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  stepHeader(t, A, 'THE OPPORTUNITY', 'HighLevel Is Huge');
  stats.forEach(([val, fmt, l1, l2, col], i) => {
    const st = A + 0.5 + i * 0.3;
    const p = backOut(prog(t, st, st + 0.5));
    if (p <= 0) return;
    const x = i % 2 === 0 ? 80 : 560, y = 460 + Math.floor(i / 2) * 400;
    ctx.save(); ctx.globalAlpha *= clamp(p);
    ctx.translate(x + 220, y + 175); ctx.scale(clamp(p, 0, 1.2), clamp(p, 0, 1.2)); ctx.translate(-220, -175);
    card(0, 0, 440, 350, col, { glow: 18, lw: 3, r: 28 });
    const v = val * easeOut(prog(t, st + 0.2, st + 1.6));
    const s = fmt(v);
    text(s, 220, 160, { size: fit(fmt(val), 92, 380), weight: 900, color: col, align: 'center', glow: 20 });
    text(l1, 220, 235, { size: 32, weight: 700, color: '#ffffff', align: 'center' });
    text(l2, 220, 280, { size: 32, weight: 700, color: '#ffffff', align: 'center' });
    ctx.restore();
  });
  caption(t, A + 2.0, ['A huge, growing platform =', '*real demand* for GHL experts.']);
  ctx.restore();
}

// ---------- scene 3: one platform replaces 6–8 tools ----------
const S3 = 10.4, S3E = 16.4;
const tools = [['👥', 'CRM'], ['🧲', 'Funnels'], ['✉️', 'Email'], ['📱', 'SMS'], ['📅', 'Booking'], ['⭐', 'Reviews'], ['🗓️', 'Social'], ['🎓', 'Courses']];
function scene3(t) {
  const A = S3;
  const a = sceneAlpha(t, A, S3E);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  stepHeader(t, A, '01 · WHAT GHL IS', 'One Platform, 6–8 Tools');
  const cx = 540, cy = 930, R = 360;
  const merge = easeInOut(prog(t, A + 2.8, A + 3.5));
  tools.forEach(([ic, name], i) => {
    const st = A + 0.5 + i * 0.18;
    const p = backOut(prog(t, st, st + 0.4));
    if (p <= 0 || merge >= 1) return;
    const ang = -Math.PI / 2 + i * Math.PI / 4;
    const x = lerp(cx + Math.cos(ang) * R, cx, merge), y = lerp(cy + Math.sin(ang) * R, cy, merge);
    const s = clamp(p, 0, 1.2) * (1 - merge * 0.7);
    ctx.save(); ctx.globalAlpha *= clamp(p) * (1 - merge * 0.8);
    ctx.translate(x, y); ctx.scale(s, s);
    card(-90, -80, 180, 160, rgba(TEXT, 0.35), { r: 26 });
    text(ic, 0, 0, { size: 60, align: 'center' });
    text(name, 0, 55, { size: 28, weight: 800, color: '#ffffff', align: 'center' });
    ctx.restore();
    // a "separate tool" price tag
    if (merge === 0 && t > st + 0.4) text('$', x + 70, y - 60, { size: 30, weight: 900, color: RED, align: 'center', alpha: prog(t, st + 0.4, st + 0.6) });
  });
  const hp = backOut(prog(t, A + 3.3, A + 3.9));
  if (hp > 0) {
    ctx.save(); ctx.globalAlpha *= clamp(hp); ctx.translate(cx, cy); ctx.scale(clamp(hp, 0, 1.2), clamp(hp, 0, 1.2));
    ctx.shadowColor = NEON; ctx.shadowBlur = 50 + Math.sin(t * 5) * 14;
    rr(-250, -110, 500, 220, 40); ctx.fillStyle = NEON; ctx.fill();
    ctx.shadowBlur = 0;
    text('ALL-IN-ONE', 0, -40, { size: 26, weight: 700, color: '#25400a', align: 'center', font: MONO });
    text('HighLevel', 0, 30, { size: 76, weight: 900, color: '#081004', align: 'center' });
    text('built for agencies', 0, 78, { size: 28, weight: 700, color: '#25400a', align: 'center' });
    ctx.restore();
    // shockwave
    const rp = prog(t, A + 3.4, A + 4.4);
    if (rp > 0 && rp < 1) {
      ctx.save(); ctx.globalAlpha *= 1 - rp;
      ctx.strokeStyle = NEON; ctx.lineWidth = 4; ctx.shadowColor = NEON; ctx.shadowBlur = 20;
      rr(cx - 250 - rp * 150, cy - 110 - rp * 150, 500 + rp * 300, 220 + rp * 300, 40 + rp * 60); ctx.stroke();
      ctx.restore();
    }
  }
  caption(t, A + 1.0, ['CRM, funnels, email/SMS, booking, reviews,', 'social & courses — *in one system*.']);
  ctx.restore();
}

// ---------- scene 4: agency vs sub-account ----------
const S4 = 16.2, S4E = 22.6;
const subs = [['🦷', 'Dental clinic', 210], ['🏠', 'Roofing company', 540], ['💆', 'Med spa', 870]];
function scene4(t) {
  const A = S4;
  const a = sceneAlpha(t, A, S4E);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  stepHeader(t, A, '01 · THE STRUCTURE', 'Master the 2 Levels');
  // agency box
  const ap = easeOut(prog(t, A + 0.3, A + 0.8));
  enter(ap, 0, 30, () => {
    card(110, 440, 860, 170, NEON, { glow: 20, lw: 3, r: 28, fill: 'rgba(200,255,46,0.1)' });
    text('YOUR AGENCY ACCOUNT', 540, 510, { size: 44, weight: 900, color: '#ffffff', align: 'center' });
    text('Snapshots · Billing · SaaS · White-label', 540, 565, { size: 28, weight: 700, color: NEON, align: 'center', font: MONO });
  });
  subs.forEach(([ic, name, x], i) => {
    const st = A + 0.9 + i * 0.25;
    const lp = easeOut(prog(t, st, st + 0.3));
    if (lp > 0) line(540, 612, lerp(540, x, lp), lerp(612, 780, lp), rgba(NEON, 0.6), 3, 10, [8, 8]);
    const p = backOut(prog(t, st + 0.2, st + 0.6));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= clamp(p); ctx.translate(x, 900); ctx.scale(clamp(p, 0, 1.2), clamp(p, 0, 1.2));
    card(-150, -120, 300, 240, CYAN, { r: 24, lw: 2.5 });
    text(`SUB-ACCOUNT ${i + 1}`, 0, -76, { size: 22, weight: 700, color: CYAN, align: 'center', font: MONO });
    text(ic, 0, 10, { size: 64, align: 'center' });
    text(name, 0, 70, { size: fit(name, 30, 270, 800), weight: 800, color: '#ffffff', align: 'center' });
    ctx.restore();
  });
  // snapshot travelling to each client
  subs.forEach(([, , x], i) => {
    const st = A + 2.4 + i * 0.5;
    const p = easeInOut(prog(t, st, st + 0.45));
    if (p > 0 && p < 1) {

  ctx.restore();
}
